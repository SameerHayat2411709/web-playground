<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Playground</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 50px; }
        h1 { color: #333; }
        .project-list { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 30px; }
        .btn { display: inline-block; padding: 12px 24px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; width: 200px; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>Welcome to My Web Playground! 🚀</h1>
    <p>Click a project below to check out what I've built:</p>

    <div class="project-list">
        <!-- This link automatically opens your Playground1 folder! -->
        <a class="btn" href="./Playground1/">🎮 Project 1 </a>
        
        <!-- You can uncomment and update this later when you add a second project -->
        <!-- <a class="btn" href="./Playground2/">🧮 Project 2</a> -->
    </div>

</body>
</html>
